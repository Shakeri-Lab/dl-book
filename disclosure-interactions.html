<script>
(() => {
  "use strict";

  const toggleSelector =
    ".callout > .callout-header[data-bs-toggle='collapse']";
  const sidebarToggleSelector =
    "#quarto-sidebar .sidebar-item-section > .sidebar-item-container > " +
    ".sidebar-item-text[data-bs-toggle='collapse']";
  const sidebarChevronSelector =
    "#quarto-sidebar .sidebar-item-section > .sidebar-item-container > " +
    ".sidebar-item-toggle[data-bs-toggle='collapse']";

  function visibleTitle(header) {
    const title = header.querySelector(":scope > .callout-title-container");
    if (!title) return "";

    const copy = title.cloneNode(true);
    copy.querySelectorAll(".screen-reader-only").forEach((node) => node.remove());
    return copy.textContent.replace(/\s+/g, " ").trim();
  }

  function initializeToggle(header) {
    const label = visibleTitle(header);
    header.setAttribute("role", "button");
    header.setAttribute("tabindex", "0");
    if (label) header.setAttribute("aria-label", label);
    header.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      header.click();
    });
  }

  function initializeSidebarToggle(toggle) {
    const label = toggle.querySelector(".menu-text")?.textContent
      .replace(/\s+/g, " ")
      .trim();
    toggle.setAttribute("role", "button");
    toggle.setAttribute("tabindex", "0");
    if (label) toggle.setAttribute("aria-label", label);
    toggle.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggle.click();
    });

    const chevron = toggle.parentElement?.querySelector(
      ".sidebar-item-toggle[data-bs-toggle='collapse']"
    );
    if (chevron) {
      chevron.setAttribute("aria-hidden", "true");
      chevron.setAttribute("role", "presentation");
      chevron.setAttribute("tabindex", "-1");
      chevron.removeAttribute("aria-label");
    }
  }

  function initializeSidebarChevron(chevron) {
    const container = chevron.parentElement;
    const title = container?.querySelector(
      ":scope > .sidebar-item-text .menu-text"
    )?.textContent.replace(/\s+/g, " ").trim();
    const titleIsToggle = container?.querySelector(
      ":scope > .sidebar-item-text[data-bs-toggle='collapse']"
    );
    if (titleIsToggle) return;

    chevron.setAttribute("role", "button");
    chevron.setAttribute("tabindex", "0");
    if (title) chevron.setAttribute("aria-label", `Toggle chapters in ${title}`);
    chevron.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      chevron.click();
    });
  }

  function revealHashTarget() {
    if (!window.location.hash) return;

    let target;
    try {
      target = document.querySelector(window.location.hash);
    } catch (_error) {
      return;
    }
    if (!target) return;

    const callout = target.closest(".callout");
    const body = callout?.querySelector(":scope > .callout-collapse");
    const header = callout?.querySelector(":scope > .callout-header");
    if (!body || body.classList.contains("show")) return;

    if (window.bootstrap?.Collapse) {
      window.bootstrap.Collapse.getOrCreateInstance(body, { toggle: false }).show();
    } else {
      header?.click();
    }
  }

  document.querySelectorAll(toggleSelector).forEach(initializeToggle);
  document.querySelectorAll(sidebarToggleSelector).forEach(initializeSidebarToggle);
  document.querySelectorAll(sidebarChevronSelector).forEach(initializeSidebarChevron);
  revealHashTarget();
  window.addEventListener("hashchange", revealHashTarget);
})();
</script>
