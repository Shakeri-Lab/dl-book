<script>
(() => {
  "use strict";

  const minimumAspectRatio = 2.8;
  // An executed figure (/figure-html/) carries the width it is drawn at: half the pixel
  // width of a retina PNG, 2 CSS px per pt for an SVG (ruling D4). Other figures (the
  // TikZ diagrams) are tested by their natural width, as before.
  const minimumDrawnWidth = 300;
  const minimumNaturalWidth = 600;
  const narrowViewport = window.matchMedia("(max-width: 600px)");
  const frames = new Map();
  let synchronizationPending = false;
  const resizeObserver = window.ResizeObserver
    ? new ResizeObserver(scheduleSynchronization) : null;

  function synchronizeAccessibility() {
    frames.forEach((description, frame) => {
      const overflowing = frame.clientWidth > 0 && frame.scrollWidth > frame.clientWidth + 1;
      frame.classList.toggle("is-overflowing", overflowing);
      if (overflowing) {
        frame.tabIndex = 0;
        frame.setAttribute("role", "region");
        frame.setAttribute("aria-label", description);
      } else {
        frame.removeAttribute("tabindex");
        frame.removeAttribute("role");
        frame.removeAttribute("aria-label");
      }
    });
  }

  function scheduleSynchronization() {
    if (synchronizationPending) return;
    synchronizationPending = true;
    window.requestAnimationFrame(() => {
      synchronizationPending = false;
      synchronizeAccessibility();
    });
  }

  function registerFrame(frame, content, description) {
    if (frames.has(frame)) return;
    frames.set(frame, description);
    frame.addEventListener("keydown", (event) => {
      if (event.target !== frame || !frame.classList.contains("is-overflowing")) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const direction = event.key === "ArrowRight" ? 1 : -1;
      frame.scrollBy({ left: direction * frame.clientWidth * 0.6 });
    });
    resizeObserver?.observe(frame);
    resizeObserver?.observe(content);
  }

  function wrapRouteTable() {
    const table = document.querySelector("#the-route-at-a-glance > table");
    if (!table || table.closest(".responsive-route-table-frame")) return;
    const frame = document.createElement("div");
    frame.className = "responsive-route-table-frame";
    table.before(frame);
    frame.append(table);
    registerFrame(frame, table, "Five-part route table. Scroll horizontally to inspect.");
  }

  function inspectionLabel(description) {
    const title = description.trim().replace(/\s+/g, " ").replace(/[.!?]+$/, "");
    return `${title}. Scroll horizontally to inspect.`;
  }

  function wrapTables() {
    document.querySelectorAll("main.content table").forEach((table) => {
      // Nested data tables share the outer scroller; keep the route's own sizing.
      if (table.parentElement.closest("table, .responsive-route-table-frame")) return;
      let frame = table.closest(
        ".responsive-table-frame, .table-responsive, .quarto-float-tbl > div, .interlude-table > div"
      );
      if (!frame) {
        frame = document.createElement("div");
        table.before(frame);
        frame.append(table);
      }
      frame.classList.add("responsive-table-frame");
      const caption = table.caption || table.closest(".quarto-float-tbl, .interlude-table")
        ?.querySelector("figcaption, .quarto-float-caption");
      registerFrame(frame, table, inspectionLabel(
        caption?.textContent || table.getAttribute("aria-label") || "Table"
      ));
    });
  }

  function wideEnough(image) {
    if ((image.getAttribute("src") || "").includes("/figure-html/")) {
      return (Number(image.getAttribute("width")) || image.naturalWidth) >= minimumDrawnWidth;
    }
    return image.naturalWidth >= minimumNaturalWidth;
  }

  function classify(image) {
    const apply = () => {
      if (!image.naturalHeight) return;
      const aspectRatio = image.naturalWidth / image.naturalHeight;
      const explicitlyWide = Boolean(
        image.closest(".responsive-wide-opt-in")
      );
      if (
        !wideEnough(image) ||
        (!explicitlyWide && aspectRatio < minimumAspectRatio)
      ) return;

      const frame = image.parentElement;
      if (!frame) return;
      image.classList.add("responsive-wide-figure");
      frame.classList.add("responsive-wide-figure-frame");
      registerFrame(frame, image, inspectionLabel(image.alt || "Wide figure"));
      synchronizeAccessibility();
    };

    if (image.complete) apply();
    else image.addEventListener("load", apply, { once: true });
  }

  document.querySelectorAll(".quarto-figure img.figure-img").forEach(classify);
  wrapRouteTable();
  wrapTables();
  synchronizeAccessibility();
  narrowViewport.addEventListener("change", scheduleSynchronization);
  window.addEventListener("resize", scheduleSynchronization);
  window.addEventListener("load", scheduleSynchronization);
  document.addEventListener("load", scheduleSynchronization, true);
  document.addEventListener("toggle", scheduleSynchronization, true);
  document.addEventListener("shown.bs.collapse", scheduleSynchronization);
  document.addEventListener("hidden.bs.collapse", scheduleSynchronization);
  document.fonts?.ready.then(scheduleSynchronization);
  document.fonts?.addEventListener("loadingdone", scheduleSynchronization);
})();
</script>
