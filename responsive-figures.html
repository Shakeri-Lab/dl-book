<script>
(() => {
  "use strict";

  const minimumAspectRatio = 2.8;
  const minimumNaturalWidth = 600;
  const narrowViewport = window.matchMedia("(max-width: 600px)");
  const wideFrames = new Set();
  const routeFrames = new Set();

  function synchronizeAccessibility() {
    wideFrames.forEach((frame) => {
      if (narrowViewport.matches) {
        const image = frame.querySelector("img.responsive-wide-figure");
        const description = (image?.alt || "Wide figure")
          .trim()
          .replace(/[.!?]+$/, "");
        frame.tabIndex = 0;
        frame.setAttribute("role", "region");
        frame.setAttribute(
          "aria-label",
          `${description}. Scroll horizontally to inspect.`
        );
      } else {
        frame.removeAttribute("tabindex");
        frame.removeAttribute("role");
        frame.removeAttribute("aria-label");
      }
    });
    routeFrames.forEach((frame) => {
      if (narrowViewport.matches) {
        frame.tabIndex = 0;
        frame.setAttribute("role", "region");
        frame.setAttribute(
          "aria-label",
          "Five-part route table. Scroll horizontally to inspect."
        );
      } else {
        frame.removeAttribute("tabindex");
        frame.removeAttribute("role");
        frame.removeAttribute("aria-label");
      }
    });
  }

  function wrapRouteTable() {
    const table = document.querySelector("#the-route-at-a-glance > table");
    if (!table || table.closest(".responsive-route-table-frame")) return;
    const frame = document.createElement("div");
    frame.className = "responsive-route-table-frame";
    table.before(frame);
    frame.append(table);
    frame.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const direction = event.key === "ArrowRight" ? 1 : -1;
      frame.scrollBy({ left: direction * frame.clientWidth * 0.6 });
    });
    routeFrames.add(frame);
  }

  function classify(image) {
    const apply = () => {
      if (!image.naturalHeight) return;
      const aspectRatio = image.naturalWidth / image.naturalHeight;
      const explicitlyWide = Boolean(
        image.closest(".responsive-wide-opt-in")
      );
      if (
        image.naturalWidth < minimumNaturalWidth ||
        (!explicitlyWide && aspectRatio < minimumAspectRatio)
      ) return;

      const frame = image.parentElement;
      if (!frame) return;
      image.classList.add("responsive-wide-figure");
      frame.classList.add("responsive-wide-figure-frame");
      frame.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        frame.scrollBy({ left: direction * frame.clientWidth * 0.6 });
      });
      wideFrames.add(frame);
      synchronizeAccessibility();
    };

    if (image.complete) apply();
    else image.addEventListener("load", apply, { once: true });
  }

  document.querySelectorAll(".quarto-figure img.figure-img").forEach(classify);
  wrapRouteTable();
  synchronizeAccessibility();
  narrowViewport.addEventListener("change", synchronizeAccessibility);
})();
</script>
