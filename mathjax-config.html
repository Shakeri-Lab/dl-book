<script>
  // Book math macros — keep in sync with tex/macros.tex (PDF path).
  // MathJax reads this config because it is defined before the MathJax
  // script loads (Quarto places include-in-header above its math script).
  window.MathJax = {
    loader: {
      load: ["ui/lazy"]
    },
    options: {
      // Numbered equations are citation targets.  Keep their anchors fully
      // laid out on first paint; inline and unnumbered mathematics stay lazy.
      // `head` is an always-present, math-free sentinel.  MathJax's lazy
      // handler must not receive an empty container list on chapters that
      // have no numbered equations.
      lazyAlwaysTypeset: ["head", 'span[id^="eq-"]']
    },
    tex: {
      macros: {
        E: "\\mathbb{E}",
        Ex: "\\operatorname{E}",
        var: "\\operatorname{Var}",
        cov: "\\operatorname{Cov}",
        imp: "\\Rightarrow",
        argmax: "\\operatorname*{arg\\,max}",
        argmin: "\\operatorname*{arg\\,min}",
        norm: ["\\left\\lVert#1\\right\\rVert", 1],
        vect: ["\\boldsymbol{#1}", 1],
        matr: ["\\boldsymbol{#1}", 1],
        R: "\\mathbb{R}",
        dd: "\\mathrm{d}",
        loss: "\\mathcal{L}",
        featurepart: ["\\style{color:rgb(43,108,176)}{#1}", 1],
        parameterpart: ["\\style{color:rgb(192,86,33)}{#1}", 1],
        targetpart: ["\\style{color:rgb(128,90,213)}{#1}", 1],
        predictionpart: ["\\style{color:rgb(47,133,90)}{#1}", 1],
        residualpart: ["\\style{color:rgb(114,47,55)}{#1}", 1]
      }
    }
  };
</script>
