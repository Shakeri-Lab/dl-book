name: Render and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export_notebooks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: scripts/notebook_ci_requirements.txt

      - name: Install notebook export tooling
        run: python -m pip install -r scripts/notebook_ci_requirements.txt

      - name: Export learner-visible notebooks
        run: >-
          python scripts/export_notebooks.py
          --output-dir build/notebooks/source
          --reference-output-dir build/notebooks/reference-source
          --revision "$GITHUB_SHA"

      - name: Audit exported notebook structure
        run: >-
          python scripts/audit_notebook_exports.py build/notebooks/source
          --reference-source-dir build/notebooks/reference-source

      - name: Preserve notebook sources for clean execution
        uses: actions/upload-artifact@v4
        with:
          name: notebook-sources
          path: build/notebooks/source/*.ipynb
          if-no-files-found: error
          retention-days: 7

      - name: Preserve canonical notebook references for validation
        uses: actions/upload-artifact@v4
        with:
          name: notebook-reference-sources
          path: build/notebooks/reference-source/*.ipynb
          if-no-files-found: error
          retention-days: 7

  validate_notebooks:
    needs: export_notebooks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            scripts/notebook_requirements.txt
            scripts/notebook_ci_requirements.txt

      - name: Install clean notebook runner
        run: >-
          python -m pip install
          -r scripts/notebook_requirements.txt
          -r scripts/notebook_ci_requirements.txt

      - name: Record notebook runtime provenance
        env:
          NOTEBOOK_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p build/notebooks/evidence
          {
            echo "git_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "shard=$NOTEBOOK_SHARD"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "runner_image_release=${ImageRelease:-unknown}"
            uname -a
            lscpu | sed -n '/Architecture/p;/Model name/p;/Vendor ID/p;/CPU family/p'
            python -VV 2>&1
            python - <<'PY'
          import json
          import platform
          import sys

          import matplotlib
          import nbclient
          import nbconvert
          import nbformat
          import numpy
          import torch
          import torchvision

          print(json.dumps({
              "machine": platform.machine(),
              "matplotlib": matplotlib.__version__,
              "nbclient": nbclient.__version__,
              "nbconvert": nbconvert.__version__,
              "nbformat": nbformat.__version__,
              "numpy": numpy.__version__,
              "platform": platform.platform(),
              "python": sys.version,
              "torch": torch.__version__,
              "torch_num_threads": torch.get_num_threads(),
              "torchvision": torchvision.__version__,
          }, sort_keys=True))
          print(torch.__config__.show())
          PY
            python -m pip freeze --all
          } > build/notebooks/evidence/environment.txt

      - name: Download exported notebook sources
        uses: actions/download-artifact@v4
        with:
          name: notebook-sources
          path: build/notebooks/source

      - name: Download canonical notebook references
        uses: actions/download-artifact@v4
        with:
          name: notebook-reference-sources
          path: build/notebooks/reference-source

      - name: Execute and audit notebook shard
        env:
          NOTEBOOK_SHARD: ${{ matrix.shard }}
          NOTEBOOK_SHARD_COUNT: 6
        run: |
          mapfile -t notebook_slugs < <(
            python scripts/notebook_manifest.py \
              --list-slugs \
              --shard-index "$NOTEBOOK_SHARD" \
              --shard-count "$NOTEBOOK_SHARD_COUNT"
          )
          test "${#notebook_slugs[@]}" -gt 0
          mkdir -p \
            build/notebooks/executed \
            build/notebooks/reference-executed \
            build/notebooks/validated \
            build/notebooks/evidence
          audit_args=()
          for notebook_slug in "${notebook_slugs[@]}"; do
            public_dir=$(mktemp -d)
            reference_dir=$(mktemp -d)
            runtime_dir=$(mktemp -d)
            cp "build/notebooks/source/${notebook_slug}.ipynb" "$public_dir/"
            cp \
              "build/notebooks/reference-source/${notebook_slug}.ipynb" \
              "$reference_dir/"
            for notebook_form in public reference; do
              if [[ "$notebook_form" == public ]]; then
                input_dir="$public_dir"
                output_dir="$GITHUB_WORKSPACE/build/notebooks/executed"
              else
                input_dir="$reference_dir"
                output_dir="$GITHUB_WORKSPACE/build/notebooks/reference-executed"
              fi
              full_log=$(mktemp)
              if ! DLBOOK_NOTEBOOK_ROOT="$runtime_dir/$notebook_form" jupyter nbconvert \
                --to notebook \
                --execute "$input_dir/${notebook_slug}.ipynb" \
                --output "${notebook_slug}.ipynb" \
                --output-dir "$output_dir" \
                --ExecutePreprocessor.timeout=3600 \
                >"$full_log" 2>&1; then
                evidence_log="build/notebooks/evidence/${notebook_slug}-${notebook_form}.log"
                tail -c 65536 "$full_log" > "$evidence_log"
                cat "$evidence_log"
                exit 1
              fi
              rm -f "$full_log"
            done
            cp \
              "build/notebooks/source/${notebook_slug}.ipynb" \
              build/notebooks/validated/
            audit_args+=(--slug "$notebook_slug")
          done
          python scripts/audit_notebook_exports.py build/notebooks/source \
            --reference-source-dir build/notebooks/reference-source \
            --executed-dir build/notebooks/executed \
            --executed-reference-dir build/notebooks/reference-executed \
            --freeze-policy portable \
            --failure-report \
              "build/notebooks/evidence/shard-${NOTEBOOK_SHARD}.txt" \
            "${audit_args[@]}"

      - name: Preserve notebook validation provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-validation-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            build/notebooks/evidence/environment.txt
            build/notebooks/evidence/shard-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failed execution evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-failure-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: build/notebooks/evidence/*
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve validated notebook for publication
        uses: actions/upload-artifact@v4
        with:
          name: validated-notebooks-${{ matrix.shard }}
          path: build/notebooks/validated/*.ipynb
          if-no-files-found: error
          retention-days: 7

  build-deploy:
    needs: validate_notebooks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
          tinytex: true
        env:
          # Authenticated API calls — avoids rate-limit failures resolving tinytex
          # releases. The action reads GH_TOKEN; set both to be safe.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Needed even with `freeze: true` — belt and suspenders for any
      # chapter accidentally committed without a freeze cache.
      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install PDF text tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install PDF layout dependencies
        run: |
          tlmgr_path=$(find "$HOME/.TinyTeX" \( -type f -o -type l \) -name tlmgr -print -quit)
          test -n "$tlmgr_path"
          "$tlmgr_path" update --self
          "$tlmgr_path" install fvextra

      - name: Audit manuscript contracts
        run: |
          python scripts/audit_plan_code.py
          python scripts/audit_book_contract.py
          python scripts/audit_python_sources.py
          python scripts/audit_public_anchors.py

      - name: Render both PDF profiles to an exact outline fixpoint
        run: python scripts/render_pdf_profiles.py

      # PDF profiles share _book with the website and may prune Quarto's
      # generated site_libs. Restore the canonical edition after both PDFs.
      - name: Render canonical HTML bundle last
        run: >-
          quarto render --to html --no-clean --debug
          --log build/quarto-html-final-render.log

      - name: Add validated notebooks to the HTML bundle
        uses: actions/download-artifact@v4
        with:
          pattern: validated-notebooks-*
          path: _book/notebooks
          merge-multiple: true

      - name: Audit the publication notebook set
        run: python scripts/audit_notebook_exports.py _book/notebooks

      - name: Audit rendered HTML support assets
        run: python scripts/audit_html_assets.py _book

      - name: Audit PDF geometry, glyphs, and accessible icon text
        run: |
          python scripts/audit_pdf.py \
            _book/Deep-Learning--Making-It-Learnable.pdf \
            --log-root .
          python scripts/audit_pdf.py \
            _book/Deep-Learning--Making-It-Learnable--Continuous.pdf \
            --log-root .

      - name: Audit rendered public anchors
        run: python scripts/audit_public_anchors.py --rendered _book

      - name: Audit frozen stdout parity
        run: python scripts/audit_frozen_stdout.py

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          # Publish the exact bundle that passed the audits above. Re-rendering
          # here can replace audited PDFs and needlessly repeat both profiles.
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  link-check:
    runs-on: ubuntu-latest
    needs: build-deploy
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Check links in sources
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,201,202,204,206,301,302,303,307,308,403,429 chapters/ index.qmd download.html README.md
          fail: false
