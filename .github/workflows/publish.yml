name: Render and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep a superseded build from racing a newer deployment. The main-tip check
# below also rejects a manually rerun historical commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export_notebooks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            scripts/notebook_ci_requirements.txt
            scripts/provenance_requirements.txt

      - name: Install notebook export tooling
        run: python -m pip install -r scripts/notebook_ci_requirements.txt

      - name: Set up HTML interaction test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/html-tests/package-lock.json

      - name: Test code disclosures and responsive tables
        run: |
          npm ci --prefix scripts/html-tests --ignore-scripts
          node --test scripts/test_plan_result_disclosure.cjs scripts/test_responsive_tables.cjs

      - name: Export learner-visible notebooks
        run: >-
          python scripts/export_notebooks.py
          --output-dir build/notebooks/source
          --reference-output-dir build/notebooks/reference-source
          --revision "$GITHUB_SHA"

      - name: Test notebook learning-loop contracts
        run: |
          python scripts/test_notebook_roundtrip.py
          python scripts/test_plan_code_audit.py
          python scripts/test_execution_identity.py
          python scripts/test_prediction_fences.py
          python scripts/test_canonical_notebooks.py

      - name: Audit exported notebook structure
        run: >-
          python scripts/audit_notebook_exports.py build/notebooks/source
          --reference-source-dir build/notebooks/reference-source

      - name: Preserve notebook sources for clean execution
        uses: actions/upload-artifact@v4
        with:
          name: notebook-sources
          path: build/notebooks/source/*.ipynb
          if-no-files-found: error
          retention-days: 7

      - name: Preserve canonical notebook references for validation
        uses: actions/upload-artifact@v4
        with:
          name: notebook-reference-sources
          path: build/notebooks/reference-source/*.ipynb
          if-no-files-found: error
          retention-days: 7

  validate_notebooks:
    needs: export_notebooks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout publication source and canonical history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up host provenance Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: scripts/provenance_requirements.txt

      - name: Install host provenance parser
        run: python -m pip install -r scripts/provenance_requirements.txt

      - name: Resolve the promoted freeze's immutable runtime
        id: canonical
        run: >-
          python scripts/run_canonical_notebooks.py prepare
          --context build/notebooks/canonical-context.json
          --github-output "$GITHUB_OUTPUT"

      - name: Download exported notebook sources
        uses: actions/download-artifact@v4
        with:
          name: notebook-sources
          path: build/notebooks/source

      - name: Download canonical notebook references
        uses: actions/download-artifact@v4
        with:
          name: notebook-reference-sources
          path: build/notebooks/reference-source

      # Reuse the exact saved image from the first proven run. An expired or
      # unavailable artifact fails closed; never rebuild or install numerical wheels.
      - name: Download the canonical CPU image
        if: steps.canonical.outputs.image_source == 'actions'
        uses: actions/download-artifact@v4
        with:
          name: canonical-freeze-image
          run-id: ${{ steps.canonical.outputs.image_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/canonical-image

      - name: Retrieve the explicitly archived canonical CPU image
        if: steps.canonical.outputs.image_source == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/run_canonical_notebooks.py fetch-image
          --context build/notebooks/canonical-context.json
          --output-dir build/canonical-image

      - name: Verify archive and loaded image identity
        env:
          IMAGE_ID: ${{ steps.canonical.outputs.image_id }}
        run: |
          verified_id=$(python scripts/run_canonical_notebooks.py verify-image \
            --context build/notebooks/canonical-context.json \
            --archive build/canonical-image/image.tar.gz \
            --manifest build/canonical-image/image.json)
          test "$verified_id" = "$IMAGE_ID"
          docker load --input build/canonical-image/image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_ID")" = "$IMAGE_ID"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_ID")" = linux/amd64

      - name: Execute isolated public and reference notebooks offline
        env:
          IMAGE_ID: ${{ steps.canonical.outputs.image_id }}
          SOURCE_DATE_EPOCH: ${{ steps.canonical.outputs.source_date_epoch }}
          NOTEBOOK_SHARD: ${{ matrix.shard }}
        run: |
          docker run --rm --network none --platform linux/amd64 --shm-size 1g \
            --entrypoint python --env SOURCE_DATE_EPOCH \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/source \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$PWD/build/notebooks,target=/source/build/notebooks" \
            "$IMAGE_ID" /opt/dlbook/canonical_python.py \
            /source/scripts/run_canonical_notebooks.py execute \
            --root /source --context /source/build/notebooks/canonical-context.json \
            --shard "$NOTEBOOK_SHARD" --shard-count 6

      - name: Preserve notebook validation provenance and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-validation-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            build/notebooks/canonical-context.json
            build/notebooks/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve validated notebook for publication
        uses: actions/upload-artifact@v4
        with:
          name: validated-notebooks-${{ matrix.shard }}
          path: build/notebooks/validated/*.ipynb
          if-no-files-found: error
          retention-days: 7

  build-deploy:
    needs: validate_notebooks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Assembly checks the canonical source commit, which precedes the
          # publication/provenance commit containing its generated freeze.
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
          tinytex: true
        env:
          # Authenticated API calls — avoids rate-limit failures resolving tinytex
          # releases. The action reads GH_TOKEN; set both to be safe.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/provenance_requirements.txt

      # Quarto/presentation tooling only. A missing cache must fail closed;
      # the isolated refusing kernelspec forbids fallback chapter execution.
      - name: Install Python deps
        run: python -m pip install -r requirements.txt -r scripts/provenance_requirements.txt

      - name: Install PDF text tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install PDF layout dependencies
        run: |
          tlmgr_path=$(find "$HOME/.TinyTeX" \( -type f -o -type l \) -name tlmgr -print -quit)
          test -n "$tlmgr_path"
          "$tlmgr_path" update --self
          "$tlmgr_path" install fvextra

      - name: Audit manuscript contracts
        run: |
          python scripts/audit_plan_code.py
          python scripts/audit_book_contract.py
          python scripts/audit_python_sources.py
          python scripts/audit_public_anchors.py

      - name: Test PDF input and Part-opener contracts
        run: |
          python scripts/test_pdf_build_contract.py
          QUARTO_BIN=$(command -v quarto) python scripts/test_guarded_assembly.py
          python scripts/guarded_assembly.py --verify-only

      - name: Render both PDF profiles to an exact outline fixpoint
        run: python scripts/render_pdf_profiles.py --verify-reproducible

      - name: Preserve PDF reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reproducibility-evidence-${{ github.run_attempt }}
          path: |
            build/pdf-reproducibility*.json
            build/pdf-repro-build-*.log
            build/repro-*-pdf-*-manifest.json
            build/repro-*-pdf-*.log
            build/repro-*-pdf-*.fls
            build/repro-*-pdf-*.toc
            build/repro-*-index.log
            build/repro-*-index.fls
            build/repro-*-index.toc
            build/repro-*-quarto-*-render-attempt-*.log
            build/pdf-*-manifest.json
            build/pdf-*.log
            build/pdf-*.fls
            build/pdf-*.toc
          if-no-files-found: warn
          retention-days: 14

      # PDF profiles share _book with the website and may prune Quarto's
      # generated site_libs. Restore the canonical edition after both PDFs.
      - name: Render canonical HTML bundle last
        run: python scripts/guarded_assembly.py

      - name: Preserve HTML assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-assembly-evidence-${{ github.run_attempt }}
          path: |
            build/html-assembly.json
            build/quarto-html-final-render.log
          if-no-files-found: warn
          retention-days: 14

      - name: Add validated notebooks to the HTML bundle
        uses: actions/download-artifact@v4
        with:
          pattern: validated-notebooks-*
          path: _book/notebooks
          merge-multiple: true

      - name: Audit the publication notebook set
        run: python scripts/audit_notebook_exports.py _book/notebooks --html-dir _book

      - name: Audit rendered HTML support assets
        run: python scripts/audit_html_assets.py _book

      - name: Audit PDF geometry, glyphs, and accessible icon text
        run: |
          python scripts/audit_pdf.py \
            _book/Deep-Learning--Making-It-Learnable.pdf \
            --log-root .
          python scripts/audit_pdf.py \
            _book/Deep-Learning--Making-It-Learnable--Continuous.pdf \
            --log-root .

      - name: Audit rendered public anchors
        run: python scripts/audit_public_anchors.py --rendered _book

      - name: Audit frozen stdout parity
        run: |
          python scripts/audit_frozen_stdout.py
          python scripts/guarded_assembly.py --verify-only

      - name: Refuse a superseded publication
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          publication_main_tip=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$publication_main_tip" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish superseded commit $GITHUB_SHA; main is $publication_main_tip."
            exit 1
          fi

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          # Publish the exact bundle that passed the audits above. Re-rendering
          # here can replace audited PDFs and needlessly repeat both profiles.
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  link-check:
    runs-on: ubuntu-latest
    needs: build-deploy
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Check links in sources
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,201,202,204,206,301,302,303,307,308,403,429 chapters/ index.qmd download.html README.md
          fail: false
