name: Execution Audit

# The book's covenant: every printed snippet is the executed artifact.
# This job enforces it mechanically — a full from-scratch re-execution of every
# notebook cell (freeze caches deleted), independent of the publish pipeline.
# Publishing still uses committed freeze results; the regenerated transcript
# must satisfy the exact-by-default portability ledger against that evidence.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  execute-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/notebook_requirements.txt

      - name: Install Python deps
        run: >-
          python -m pip install
          -r requirements.txt
          -r scripts/notebook_requirements.txt

      - name: Audit manuscript contracts
        run: |
          python scripts/audit_plan_code.py
          python scripts/audit_book_contract.py
          python scripts/audit_python_sources.py
          python scripts/audit_public_anchors.py

      - name: Re-execute every cell from scratch
        run: |
          rm -rf _freeze
          quarto render --to html

      - name: Compare regenerated stdout with the committed evidence
        run: >-
          python scripts/audit_frozen_stdout.py
          --base "$GITHUB_SHA"
          --policy portable

      - name: Audit rendered HTML support assets
        run: >-
          python scripts/audit_html_assets.py _book
          --allow-missing-generated-pdfs
          --allow-missing-generated-notebooks

      - name: Audit rendered public anchors
        run: python scripts/audit_public_anchors.py --rendered _book

      - name: Report
        if: success()
        run: >-
          echo "All cells executed cleanly and satisfied the reviewed stdout contracts."
