name: Execution Audit

# The book's covenant: every printed snippet is the executed artifact.
# Canonical candidates use the sealed same-image workflow. The scheduled native
# Ubuntu job is a portability report, not a replacement numerical reference.
# It reports reviewed-contract drift without blocking publication; incomplete
# execution, changed inputs, unsupported schemas, and evidence errors still fail.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Canonical candidate, native portability, or saved-image diagnostic
        type: choice
        options: [canonical-candidate, portability, canonical-probe]
        default: canonical-candidate
      source_revision:
        description: Candidate source, or original image source for a probe (blank uses mode default)
        type: string
        default: ""
      image_run_id:
        description: Saved image run ID (probe blank defaults to diagnostic run A)
        type: string
        default: ""
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

permissions:
  contents: read
  actions: read

jobs:
  canonical-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'canonical-probe'
    uses: ./.github/workflows/canonical-probe.yml
    with:
      image_source_revision: ${{ inputs.source_revision || '1da26e860d6fa76ae6b76dede273748b1439128c' }}
      image_run_id: ${{ inputs.image_run_id || '33937390845' }}

  canonical-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'canonical-candidate'
    uses: ./.github/workflows/canonical-freeze.yml
    with:
      source_revision: ${{ inputs.source_revision || github.sha }}
      image_run_id: ${{ inputs.image_run_id }}

  execute-all:
    name: Native Ubuntu portability report (not canonical)
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'portability'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DLBOOK_TORCH_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/notebook_requirements.txt
            scripts/provenance_requirements.txt

      - name: Install Python deps
        run: >-
          python -m pip install
          -r requirements.txt
          -r scripts/notebook_requirements.txt
          -r scripts/provenance_requirements.txt

      - name: Record clean source, native runtime, and committed stdout
        id: prepare
        run: >-
          python scripts/report_native_portability.py prepare
          --output build/native-portability

      - name: Audit manuscript contracts
        run: |
          python scripts/audit_plan_code.py
          python scripts/audit_book_contract.py
          python scripts/audit_python_sources.py
          python scripts/audit_public_anchors.py

      - name: Re-execute every cell from scratch in the native runtime
        id: execute
        run: |
          set -euo pipefail
          mv _freeze build/native-reference-freeze
          python scripts/report_native_portability.py execute --output build/native-portability

      - name: Record post-execution evidence and report reviewed-contract drift
        if: always() && steps.prepare.outcome == 'success'
        id: comparison
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: >-
          python scripts/report_native_portability.py finish
          --output build/native-portability
          --execution-outcome "$EXECUTION_OUTCOME"

      - name: Audit rendered HTML support assets
        run: >-
          python scripts/audit_html_assets.py _book
          --allow-missing-generated-pdfs
          --allow-missing-generated-notebooks

      - name: Audit rendered public anchors
        run: python scripts/audit_public_anchors.py --rendered _book

      - name: Summarize the native audit outcome without claiming canonical parity
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          summary = Path("build/native-portability/summary.md")
          text = summary.read_text() if summary.is_file() else (
              "## Native portability audit did not produce a completed report\n\n"
              "This is an infrastructure, setup, or execution failure, not a successful comparison.\n"
          )
          text += "\nWorkflow step outcomes: " + ", ".join(
              f"{key.lower()}={os.environ[key]}" for key in (
                  "PREPARE_OUTCOME", "EXECUTION_OUTCOME", "COMPARISON_OUTCOME"
              )
          ) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(text)
          PY

      - name: Retain native evidence even on failure (raw notebooks, source, logs, stdout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-portability-report
          path: build/native-portability/
          retention-days: 30
          if-no-files-found: warn
