<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Deep Learning: Making It Learnable</title>
  <desc id="desc">Social card for Heman Shakeri's first-principles deep learning textbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232D4B"/>
      <stop offset="1" stop-color="#182038"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="76" y="79" width="8" height="424" rx="4" fill="#E57200"/>
  <text x="126" y="174" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-1.5">Deep Learning</text>
  <text x="126" y="259" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="67" font-weight="500" letter-spacing="-1">Making It Learnable</text>
  <text x="130" y="345" fill="#DCE6F2" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="31" font-weight="400">A first-principles textbook built around one question:</text>
  <text x="130" y="394" fill="#F3B36E" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="650">what if we made this learnable?</text>
  <text x="130" y="491" fill="#DCE6F2" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="26">Heman Shakeri · University of Virginia</text>
  <g transform="translate(910 144)">
    <path d="M0 230 C70 230 72 70 145 70 S211 182 260 0"
          fill="none" stroke="#E57200" stroke-width="18" stroke-linecap="round"/>
    <circle cx="0" cy="230" r="24" fill="#FFFFFF"/>
    <circle cx="145" cy="70" r="24" fill="#FFFFFF"/>
    <circle cx="260" cy="0" r="24" fill="#E57200" stroke="#FFFFFF" stroke-width="9"/>
  </g>
</svg>
