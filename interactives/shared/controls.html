<div class="mechanism-controls" data-controls role="group" aria-label="Playback controls" hidden>
  <button type="button" data-action="play" data-state="play" aria-label="Play" title="Play">
    <svg data-icon="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    <svg data-icon="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM14 5h4v14h-4z" fill="currentColor"/></svg>
    <svg data-icon="replay" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8a8 8 0 1 1-1 8M5 3v6h6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span class="mechanism-sr" data-button-label>Play</span>
  </button>
  <label class="mechanism-scrubber"><span class="mechanism-sr">Playback position</span><input type="range" min="0" max="40" value="0" step="0.01"></label>
  <span class="mechanism-clock" aria-hidden="true"><span data-elapsed>0:00</span><span data-duration> / 0:40</span></span>
  <select data-speed aria-label="Playback speed" title="Playback speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option></select>
  <button type="button" data-action="fullscreen" data-state="expand" aria-label="Fullscreen" title="Fullscreen">
    <svg data-icon="expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <svg data-icon="contract" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span class="mechanism-sr" data-button-label>Fullscreen</span>
  </button>
</div>
<p data-notice role="status"></p>
