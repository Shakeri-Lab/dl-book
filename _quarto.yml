project:
  type: book
  output-dir: _book
  post-render:
    - scripts/postrender_html.py
  resources:
    - download.html
    - download.css
    - figures/cover.png
    - figures/cover.webp

book:
  title: "Deep Learning: Making It Learnable"
  subtitle: "What to Learn, What to Build In, and What to Reuse"
  author: "Heman Shakeri"
  # Deterministic content-revision date, not the CI/render wall-clock date.
  date: "2026-09-04"
  repo-url: https://github.com/Shakeri-Lab/dl-book
  repo-actions: [issue]
  site-url: https://shakeri-lab.github.io/dl-book/
  favicon: figures/favicon.svg
  description: >
    A first-principles deep learning textbook built around one compounding
    question: what if we made this learnable? From linear regression to the
    pretrained era.
  open-graph:
    image: figures/social-card.png
    image-alt: >
      Deep Learning: Making It Learnable, a first-principles textbook by Heman
      Shakeri.
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: figures/social-card.png
    image-alt: >
      Deep Learning: Making It Learnable, a first-principles textbook by Heman
      Shakeri.
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    tools:
      - icon: file-pdf
        text: "Get the PDF"
        aria-label: "Get the PDF"
        href: download.html
    footer: "[Revision notes](https://shakeri-lab.github.io/dl-book/#revision-notes)"
  page-footer:
    left: >
      © Heman Shakeri · Text CC BY-NC-SA 4.0 · Code MIT ·
      School of Data Science, University of Virginia
    right: >
      Companion to [DS 6050 Deep Learning](https://shakeri-lab.github.io/dl-course-site/)
  chapters:
    - index.qmd
    - part: chapters/parts/p1-lines-to-networks.qmd
      chapters:
        - chapters/part1/01-linear-regression.qmd
        - chapters/part1/02-logistic-softmax.qmd
        - chapters/part1/03-nonlinearity-mlp.qmd
        - chapters/part1/04-training-loss-sgd.qmd
        - chapters/part1/05-backpropagation.qmd
        - chapters/part1/06-generalization-inductive-bias.qmd
    - chapters/interludes/learning-by-experiment.qmd
    - part: chapters/parts/p2-vision.qmd
      chapters:
        - chapters/part2/07-filters-convolution.qmd
        - chapters/part2/08-cnn.qmd
        - chapters/part2/09-modern-cnns-transfer.qmd
    - chapters/interludes/making-pca-learnable.qmd
    - part: chapters/parts/p3-sequences.qmd
      chapters:
        - chapters/part3/10-sequences-rnn.qmd
        - chapters/part3/11-encoder-decoder.qmd
    - part: chapters/parts/p4-attention.qmd
      chapters:
        - chapters/part4/12-kernel-regression.qmd
        - chapters/part4/13-attention.qmd
        - chapters/part4/14-self-attention-transformer.qmd
        - chapters/interludes/attention-as-test-time-regression.qmd
        - chapters/part4/15-bert-pretraining.qmd
        - chapters/part4/16-vit-scaling.qmd
    - part: chapters/parts/p5-pretrained-era.qmd
      chapters:
        - chapters/part5/17-peft-quantization.qmd
        - chapters/part5/18-alignment.qmd
        - chapters/part5/19-generative.qmd
        - chapters/part5/20-multimodal.qmd
    - chapters/epilogue.qmd
  appendices:
    - chapters/appendices/a1-linear-algebra.qmd
    - chapters/appendices/a2-tensors.qmd
    - chapters/appendices/a3-precision-performance.qmd
    - chapters/appendices/a4-notation.qmd
    - chapters/appendices/a5-statistical-learning.qmd

execute:
  freeze: true
  warning: false

crossref:
  custom:
    - kind: float
      key: exfig
      latex-env: exfig
      reference-prefix: Figure EX.
      caption-prefix: Figure EX.
      space-before-numbering: false
    - kind: float
      key: aefig
      latex-env: aefig
      reference-prefix: Figure AE.
      caption-prefix: Figure AE.
      space-before-numbering: false
    - kind: float
      key: ttrfig
      latex-env: ttrfig
      reference-prefix: Figure TTR.
      caption-prefix: Figure TTR.
      space-before-numbering: false
    - kind: float
      key: epfig
      latex-env: epfig
      reference-prefix: Figure E.
      caption-prefix: Figure E.
      space-before-numbering: false
    - kind: float
      key: extbl
      latex-env: extbl
      reference-prefix: Table EX.
      caption-prefix: Table EX.
      space-before-numbering: false

filters:
  - path: filters/pdf-part-preamble.lua
    at: pre-quarto
  - path: filters/pdf-chapter-xrefs.lua
    at: pre-quarto
  - include-code-files
  - filters/plan-code.lua
  - filters/chapter-tools.lua
  - filters/lazy-images.lua

format:
  html:
    theme: [cosmo, dlbook.scss]
    canonical-url: true
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js
    include-in-header:
      - mathjax-config.html
      - citation-meta.html
    include-before-body:
      - skip-link.html
    include-after-body:
      - plan-code-interactions.html
      - disclosure-interactions.html
      - responsive-figures.html
    code-link: true
    code-copy: true
    code-fold: true
    code-tools:
      source: repo
      toggle: false
      caption: "Source"
    code-summary: "Code"
    toc: true
    toc-depth: 3
    number-depth: 2
  pdf:
    documentclass: scrbook
    pdf-engine: lualatex
    pdf-engine-opts:
      - -recorder
    keep-tex: true
    latex-clean: false
    include-in-header:
      - tex/reproducible.tex
      - tex/macros.tex
    latex-min-runs: 3
    toc: true
    number-sections: true
    colorlinks: true
    geometry:
      - margin=0.85in
