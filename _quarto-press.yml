# The press profile: the manuscript for the publisher (press program W2, I6). Render it
# locally, never in CI and never into the website's output:
#
#   quarto render --profile press --to pdf
#
# It writes to _press/, omits the web-only apparatus marked in the sources with
# `when-profile="press"`, and keeps every chapter, figure, and printed output of the
# HTML edition. scripts/audit_independence.py checks this view of the book.
project:
  output-dir: _press
  # The author's ruling 2 (September 28, 2026): the press build fails on an independence
  # hit, while the website's publish run only warns.
  pre-render:
    - scripts/audit_independence.py

book:
  output-file: Deep-Learning--Making-It-Learnable--Press
