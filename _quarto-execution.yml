# Execution-only profile: a book-mode LaTeX render composes every chapter even
# when one input was requested. Keep all inherited cell/format settings, but
# isolate each native unit so its fresh kernel has one truthful unit/format label.
# Never use this profile to publish the canonical HTML or either complete PDF.
project:
  type: default
# LaTeX-only execution must reuse source-bound PDF siblings directly. Quarto's
# SVG mediabag path otherwise copies them into the chapter's source directory.
# Keep this at profile level: format.pdf options do not apply to --to latex.
use-rsvg-convert: false
