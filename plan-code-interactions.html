<script>
(() => {
  "use strict";

  const markerPattern = /^#\s*((?:\[\d+\])+?)\s*$/;
  const numberPattern = /\[(\d+)\]/g;
  const panelMappings = new WeakMap();
  const supportsUntilFound = "onbeforematch" in document.documentElement;

  function enableUntilFoundLayout() {
    if (!supportsUntilFound) return;

    // Bootstrap declares `[hidden] { display: none !important; }`, which would
    // defeat hidden-until-found. Keep the searchable boxes in layout, but clip
    // their container out of view until beforematch opens the panel.
    document.documentElement.classList.add("plan-code-supports-until-found");
    const style = document.createElement("style");
    style.dataset.planCodeUntilFound = "";
    style.textContent = `
      html.plan-code-supports-until-found
        .plan-code.plan-code-code-collapsed
        > .plan-code-until-found-container {
        display: block !important;
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip-path: inset(50%) !important;
      }

      html.plan-code-supports-until-found
        .plan-code-code-collapsed
        .plan-code-until-found-line[hidden="until-found"] {
        display: inline-block !important;
      }

      html.plan-code-supports-until-found
        .plan-code-code-collapsed
        .plan-code-until-found-output[hidden="until-found"] {
        display: block !important;
      }
    `;
    document.head.appendChild(style);
  }

  function codeRegions(panel) {
    return [...panel.children].filter((child) => !child.classList.contains("plan"));
  }

  function markerSteps(line) {
    const steps = new Set();

    line.querySelectorAll("span.co").forEach((comment) => {
      const match = comment.textContent.trim().match(markerPattern);
      if (!match) return;

      for (const number of match[1].matchAll(numberPattern)) {
        steps.add(Number(number[1]));
      }
    });

    return [...steps];
  }

  function indentation(line) {
    const leading = line.textContent.match(/^[\t ]*/)?.[0] ?? "";
    return [...leading].reduce(
      (width, character) => width + (character === "\t" ? 4 : 1),
      0
    );
  }

  function buildMapping(panel) {
    const lines = [...panel.querySelectorAll(
      "pre.sourceCode > code.sourceCode > span[id]"
    )];
    const markers = [];

    lines.forEach((line, lineIndex) => {
      const steps = markerSteps(line);
      if (steps.length) {
        markers.push({ lineIndex, steps, indent: indentation(line) });
      }
    });

    const stepLines = new Map();
    const lineSteps = new Map();

    markers.forEach((marker, markerIndex) => {
      let endIndex = lines.length;

      for (let next = markerIndex + 1; next < markers.length; next += 1) {
        if (markers[next].indent <= marker.indent) {
          endIndex = markers[next].lineIndex;
          break;
        }
      }

      marker.steps.forEach((step) => {
        if (!stepLines.has(step)) stepLines.set(step, new Set());
        for (let lineIndex = marker.lineIndex; lineIndex < endIndex; lineIndex += 1) {
          stepLines.get(step).add(lines[lineIndex]);
        }
      });
    });

    // A beforematch event identifies the exact line the browser found. Associate
    // each line with its nearest preceding marker; setup above [1] belongs to [1].
    if (markers.length) {
      for (let lineIndex = 0; lineIndex < markers[0].lineIndex; lineIndex += 1) {
        lineSteps.set(lines[lineIndex], markers[0].steps);
      }

      markers.forEach((marker, markerIndex) => {
        const nextIndex = markers[markerIndex + 1]?.lineIndex ?? lines.length;
        for (let lineIndex = marker.lineIndex; lineIndex < nextIndex; lineIndex += 1) {
          lineSteps.set(lines[lineIndex], marker.steps);
        }
      });
    }

    return { lines, stepLines, lineSteps };
  }

  function setUntilFound(element) {
    element.setAttribute("hidden", "until-found");
    element.removeAttribute("aria-hidden");
  }

  function collapseSearchRegions(mapping) {
    mapping?.searchRegions.forEach(setUntilFound);
  }

  function openSearchRegions(mapping) {
    mapping?.searchRegions.forEach((region) => {
      region.removeAttribute("hidden");
      region.removeAttribute("aria-hidden");
    });
  }

  function collapseFocusTargets(mapping) {
    mapping?.focusTargetStates.forEach((state, target) => {
      target.setAttribute("tabindex", "-1");
      target.setAttribute("aria-hidden", "true");
    });
  }

  function openFocusTargets(mapping) {
    mapping?.focusTargetStates.forEach((state, target) => {
      if (state.tabindex === null) {
        target.removeAttribute("tabindex");
      } else {
        target.setAttribute("tabindex", state.tabindex);
      }
      if (state.ariaHidden === null) {
        target.removeAttribute("aria-hidden");
      } else {
        target.setAttribute("aria-hidden", state.ariaHidden);
      }
    });
  }

  function clearPanel(panel) {
    const mapping = panelMappings.get(panel);
    mapping?.lines.forEach((line) => {
      line.classList.remove("plan-code-line-active");
    });
    panel.querySelectorAll(".plan-step-active").forEach((item) => {
      item.classList.remove("plan-step-active");
    });
    panel.querySelectorAll(".plan-step-button").forEach((button) => {
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-expanded", "false");
    });
    if (mapping?.showAllButton) {
      mapping.showAllButton.setAttribute("aria-expanded", "false");
      mapping.showAllButton.textContent = "Show all code";
    }
    collapseSearchRegions(mapping);
    collapseFocusTargets(mapping);
    panel.classList.remove("plan-code-has-active-step");
    panel.classList.remove("plan-code-showing-all");
    panel.classList.add("plan-code-code-collapsed");
    panel.removeAttribute("data-active-plan-step");
    panel.style.removeProperty("--plan-active-color");
  }

  function openCodeRegions(mapping) {
    mapping.codeRegions.forEach((region) => {
      region.removeAttribute("hidden");
      region.removeAttribute("aria-hidden");
    });
    openSearchRegions(mapping);
    openFocusTargets(mapping);
  }

  function clearAllPanels() {
    document.querySelectorAll(".plan-code-is-interactive").forEach(clearPanel);
  }

  function revealStep(panel, step, item, button) {
    const wasActive = panel.dataset.activePlanStep === String(step);
    clearAllPanels();
    if (wasActive) return;

    const mapping = panelMappings.get(panel);
    const matchingLines = [...(mapping?.stepLines.get(step) ?? [])];
    if (!matchingLines.length) return;

    panel.classList.remove("plan-code-code-collapsed");
    openCodeRegions(mapping);
    const chipColor = getComputedStyle(item, "::before").backgroundColor;
    panel.style.setProperty("--plan-active-color", chipColor);
    panel.dataset.activePlanStep = String(step);
    panel.classList.add("plan-code-has-active-step");
    item.classList.add("plan-step-active");
    button.setAttribute("aria-pressed", "true");
    button.setAttribute("aria-expanded", "true");
    matchingLines.forEach((line) => {
      line.classList.add("plan-code-line-active");
    });

    const firstLine = matchingLines[0];
    const bounds = firstLine.getBoundingClientRect();
    if (bounds.top < 0 || bounds.bottom > window.innerHeight) {
      firstLine.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "auto"
          : "smooth",
        block: "center"
      });
    }
  }

  function activateStep(panel, step) {
    const control = panelMappings.get(panel)?.stepControls.get(step);
    if (!control) {
      showAllCode(panel);
      return;
    }

    revealStep(panel, step, control.item, control.button);
  }

  function showAllCode(panel) {
    const wasShowingAll = panel.classList.contains("plan-code-showing-all");
    clearAllPanels();
    if (wasShowingAll) return;

    const mapping = panelMappings.get(panel);
    if (!mapping) return;

    panel.classList.remove("plan-code-code-collapsed");
    panel.classList.add("plan-code-showing-all");
    openCodeRegions(mapping);
    panel.querySelectorAll(".plan-step-button").forEach((button) => {
      button.setAttribute("aria-expanded", "true");
    });
    mapping.showAllButton.setAttribute("aria-expanded", "true");
    mapping.showAllButton.textContent = "Hide code";
  }

  function initializePanel(panel, panelIndex) {
    const mapping = buildMapping(panel);
    const plan = panel.querySelector(":scope > .plan");
    const items = [...panel.querySelectorAll(":scope > .plan > ol > li")];
    if (!mapping.lines.length || !items.length) return;

    const regions = codeRegions(panel);
    regions.forEach((region, regionIndex) => {
      if (!region.id) region.id = `plan-code-${panelIndex}-${regionIndex}`;
      region.classList.add("plan-code-until-found-container");
    });

    const outputs = regions.flatMap((region) => [
      ...region.querySelectorAll(".cell-output")
    ]);
    outputs.forEach((output, outputIndex) => {
      if (!output.id) output.id = `plan-code-${panelIndex}-output-${outputIndex}`;
      output.classList.add("plan-code-until-found-output");
    });

    mapping.lines.forEach((line) => {
      line.classList.add("plan-code-until-found-line");
    });

    mapping.codeRegions = regions;
    mapping.searchRegions = [...mapping.lines, ...outputs];
    const focusTargets = regions.flatMap((region) => [
      ...region.querySelectorAll("pre.sourceCode, .code-copy-button")
    ]);
    mapping.focusTargetStates = new Map(
      focusTargets.map((target) => [
        target,
        {
          tabindex: target.getAttribute("tabindex"),
          ariaHidden: target.getAttribute("aria-hidden")
        }
      ])
    );
    mapping.stepControls = new Map();
    panelMappings.set(panel, mapping);
    panel.classList.add("plan-code-is-interactive");

    const toolbar = document.createElement("div");
    toolbar.className = "plan-code-toolbar";
    const heading = document.createElement("span");
    heading.className = "plan-code-heading";
    heading.textContent = "Plan · select a step";
    const showAllButton = document.createElement("button");
    showAllButton.type = "button";
    showAllButton.className = "plan-code-show-all";
    showAllButton.textContent = "Show all code";
    showAllButton.setAttribute("aria-expanded", "false");
    showAllButton.setAttribute(
      "aria-controls",
      regions.map((region) => region.id).join(" ")
    );
    showAllButton.addEventListener("click", () => showAllCode(panel));
    toolbar.append(heading, showAllButton);
    plan.prepend(toolbar);
    mapping.showAllButton = showAllButton;

    items.forEach((item, index) => {
      const step = index + 1;
      if (!mapping.stepLines.has(step)) return;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "plan-step-button";
      while (item.firstChild) button.appendChild(item.firstChild);
      item.appendChild(button);
      item.classList.add("plan-step-available");
      item.dataset.planStep = String(step);
      button.dataset.planStep = String(step);
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-expanded", "false");
      button.setAttribute("title", `Reveal the code for step ${step}`);
      if (regions.length) {
        button.setAttribute(
          "aria-controls",
          regions.map((region) => region.id).join(" ")
        );
      }

      button.addEventListener("click", () => {
        revealStep(panel, step, item, button);
      });
      mapping.stepControls.set(step, { item, button });
    });

    mapping.lineSteps.forEach((steps, line) => {
      line.addEventListener("beforematch", () => {
        const step = steps.find((candidate) => mapping.stepControls.has(candidate));
        if (step === undefined) {
          showAllCode(panel);
        } else {
          activateStep(panel, step);
        }
      });
    });
    outputs.forEach((output) => {
      output.addEventListener("beforematch", () => showAllCode(panel));
    });

    clearPanel(panel);
  }

  enableUntilFoundLayout();
  document.querySelectorAll(".plan-code").forEach(initializePanel);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") clearAllPanels();
  });
})();
</script>
